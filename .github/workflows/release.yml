name: Release designer extension

# The ONLY path that publishes `greentic.sorla` to the Greentic Store.
#
# `dev-publish.yml` ships the crates and the CLI binary and never touches the
# extension, and the tag-driven job that used to live in `release-binaries.yml`
# never ran after the lane moved to `develop` — which left the Store serving
# June's `1.2.0-research` while describe fixes sat on `main` unreleased.
#
# Publishing is driven by `metadata.version` in the extension's describe.json,
# NOT by the workspace version: the extension's Cargo.toml inherits
# `version.workspace = true`, which versions every crate in this workspace and
# is stamped per run by dev-publish. Bump describe.json to publish.
#
# Adapted from greentic-biz/component-hubspot-ext's release.yml.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version to (re)publish. Required."
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.diff.outputs.should_publish }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diff metadata.version in describe.json
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=crates/greentic-sorla-designer-extension/describe.json

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          extract_version() {
            git show "$1:${MANIFEST}" 2>/dev/null \
              | jq -r '.metadata.version // empty' 2>/dev/null || echo ""
          }
          NEW=$(extract_version HEAD)
          OLD=$(extract_version HEAD~1)
          echo "  HEAD~1 version: ${OLD:-<none>}"
          echo "  HEAD   version: ${NEW:-<none>}"

          if [ -z "$NEW" ] || [ "$NEW" = "$OLD" ]; then
            echo "==> No version bump — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Per-branch suffix policy: develop -> -dev, main -> stable.
          # A -dev base must sit ABOVE any -research build of the same
          # major.minor.patch (research > dev alphabetically), or hosts that
          # track the pre-release line never pick it up.
          case "${GITHUB_REF_NAME}" in
            develop)
              if [[ ! "$NEW" =~ -dev(\.[0-9A-Za-z-]+)*$ ]]; then
                echo "::error::develop expects a -dev version; got $NEW"; exit 1
              fi ;;
            main)
              if [[ "$NEW" =~ - ]]; then
                echo "::error::main expects a stable version (no prerelease suffix); got $NEW"; exit 1
              fi ;;
          esac

          echo "==> Publishing ${NEW}"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    # ci.yml has no workflow_call trigger; it delegates to this same org
    # reusable workflow, so call it directly for an equivalent gate.
    uses: greenticai/.github/.github/workflows/pr-ci.yml@main
    with:
      variant: host
    secrets: inherit

  publish:
    name: Publish .gtxpack to Greentic Store
    needs: [detect, ci]
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: greenticai/greentic-designer-extension-action@v2
        with:
          gtdx-version: "=1.3.0-research.3"
          manifest: crates/greentic-sorla-designer-extension/Cargo.toml
          store-url: https://store.greentic.cloud
          store-token: ${{ secrets.GREENTIC_STORE_TOKEN }}
          version: ${{ needs.detect.outputs.version }}
          rust-toolchain: "1.95.0"
          # The Store signs on ingest with this publisher's own key (the one
          # hosts pin in trust/publishers.json) and replaces describe.json in
          # the artifact, so there is no client key to pass.
          allow-unsigned: true
